<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 17</title>
</head>
<body>
    <h1>Const e Let</h1>
    <p>Entender valores que não podem ser alterados.</p>

    <label for="">Digite seu nome:</label>
    <input type="text" id="nome">
    <br>

    <label for="">Digite sua idade:</label>
    <input type="text" id="idade">
    <br>

    <button onclick="mostrarnome()">mostrarnome</button>

    <p id="resultado"></p>

    <script>
            function mostrarnome(){
               const sistema = "Sistema Escolar";
              
               let nome = document.getElementById("nome").value;
               let idade = document.getElementById("idade").value;
              
              document.getElementById("resultado").innerHTML = "Bem-vindo "+ nome + " que legal que você tem " + idade + " anos,é um prazer ter você aqui no " + sistema;

        }
    </script>


</body>
</html>
